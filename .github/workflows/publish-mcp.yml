name: Publish final compatibility package

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js (sets registry + auth)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          scope: "@railway"

      - name: Build package
        run: npm run build

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        run: npm install -g npm@11.14.1

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Setup Go for MCP Publisher
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install MCP Publisher
        run: |
          git clone https://github.com/modelcontextprotocol/registry publisher-repo
          cd publisher-repo
          make publisher
          cp bin/mcp-publisher ../mcp-publisher
          cd ..
          chmod +x mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Deprecate MCP Registry entry
        run: >
          ./mcp-publisher status --status deprecated --all-versions --yes
          --message "Deprecated: use the Railway CLI bundled MCP server via 'railway mcp' or 'railway mcp install'."
          io.github.railwayapp/mcp-server
